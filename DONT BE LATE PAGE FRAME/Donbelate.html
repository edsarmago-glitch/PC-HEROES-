<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don’t Be Late — kúro-kurò</title>
  <link rel="icon" href="../web-img/logo.png">
  <!-- Bootstrap 5, loaded in a lower-priority layer so the site's own styles always win -->
  <style>@import url("https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css") layer(bootstrap);</style>
  <link rel="stylesheet" href="../site.css?v=4">
</head>
<body>
  <header class="nav nav--dark nav--yellow">
    <a class="nav__logo" href="../HOME PAGE FRAME/home.html" aria-label="Home"><img src="../web-img/logo.png" alt="kúro-kurò"></a>
    <ul>
      <li><a class="link" href="../HOME PAGE FRAME/home.html">HOME</a></li>
      <li><a class="link" href="../SHOP MOCKUP FRAME/index.html">SHOP</a></li>
      <li><a class="link" href="../ABOUT FRAME/about.html">ABOUT</a></li>
      <li><a class="link" href="../index.html">CONTACT</a></li>
    </ul>
  </header>

  <main class="section--dark">
    <section class="section">
      <div class="wrap product">
        <div class="gallery">
          <div class="gallery__main"><img src="../web-img/dbl-front.jpg" alt="Don’t Be Late tee"></div>
          <div class="gallery__thumbs">
          <button type="button" aria-label="Show photo 1"><img src="../web-img/dbl-back-plain.jpg" alt="" loading="lazy"></button>
          <button type="button" aria-label="Show photo 2"><img src="../web-img/dbl-back.jpg" alt="" loading="lazy"></button>
          <button type="button" aria-label="Show photo 3"><img src="../web-img/dbl-model.jpg" alt="" loading="lazy"></button>
          </div>
        </div>
        <div class="info">
          <span class="badge">Limited time offer</span>
          <h1>Don’t Be Late</h1>
          <p class="tax">Tax included.</p>
          <p class="price">₱ 499.00</p>
          <p class="label">Available sizes:</p>
          <div class="sizes">
            <button type="button">XS</button><button type="button">S</button><button type="button" class="on">M</button><button type="button">L</button><button type="button">XL</button>
          </div>
          <p class="label">Quantity:</p>
          <div class="qty"><button type="button" data-step="-1" aria-label="Less">−</button><output>1</output><button type="button" data-step="1" aria-label="More">+</button></div>
          <div class="actions">
            <a class="btn btn--add" href="../CART FRAME/cart.html">ADD TO CART</a>
            <button class="btn btn--order" type="button" id="order-now">ORDER NOW</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <h2 class="ruled display">YOU MIGHT LIKE THIS</h2>
      <div class="wrap recs" style="margin-top:56px">
        <article class="rec">
          <div class="rec__img"><img src="../web-img/ec-main.jpg" alt="Everyday Comfort tee" loading="lazy"></div>
          <h3>Everyday Comfort</h3>
          <p>₱499.00</p>
          <a class="btn btn--yellow" href="../EVERYDAY COMFORT PAGE FRAME/everydaycomfort.html">VIEW</a>
        </article>
        <article class="rec">
          <div class="rec__img"><img src="../web-img/dgw-card.jpg" alt="Do Good Work tee" loading="lazy"></div>
          <h3>Do Good Work</h3>
          <p>₱499.00</p>
          <a class="btn btn--yellow" href="../DO GOOD WORK PAGE FRAME/dogoodwork.html">VIEW</a>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer footer--dark">
    <a href="../PRIVACY PAGE FRAME/index.html">Privacy &nbsp;•&nbsp; Terms</a>
    <span>kúro-kurò &nbsp;•&nbsp; © 2026</span>
  </footer>
  <script>
    (function () {
      var main = document.querySelector('.gallery__main img');
      document.querySelectorAll('.gallery__thumbs button').forEach(function (b) {
        b.addEventListener('click', function () {
          main.src = b.querySelector('img').src;
          document.querySelectorAll('.gallery__thumbs button').forEach(function (x) { x.classList.toggle('on', x === b); });
        });
      });
      document.querySelectorAll('.sizes button').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.sizes button').forEach(function (x) { x.classList.toggle('on', x === b); });
        });
      });
      var out = document.querySelector('.qty output');
      document.querySelectorAll('.qty button').forEach(function (b) {
        b.addEventListener('click', function () {
          out.textContent = Math.max(1, Math.min(9, +out.textContent + +b.dataset.step));
        });
      });
    })();
  </script>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="order-toast" class="toast align-items-center text-bg-success border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../order-now.js"></script>
</body>
</html>
