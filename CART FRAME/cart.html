<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart — kúro-kurò</title>
  <link rel="icon" href="../web-img/logo.png">
  <link rel="stylesheet" href="../site.css?v=4">
</head>
<body>
  <header class="nav nav--dark nav--yellow">
    <a class="nav__logo" href="../HOME PAGE FRAME/home.html" aria-label="Home"><img src="../web-img/logo.png" alt="kúro-kurò"></a>
    <ul>
      <li><a class="link" href="../HOME PAGE FRAME/home.html">HOME</a></li>
      <li><a class="link" href="../SHOP MOCKUP FRAME/index.html">SHOP</a></li>
      <li><a class="link" href="../ABOUT FRAME/about.html">ABOUT</a></li>
      <li><a class="link" href="../index.html">CONTACT</a></li>
    </ul>
  </header>

  <main class="section section--dark">
    <div class="wrap">
      <h1 class="cart-title display">YOUR CART:</h1>
      <div class="cart-slots"><div></div><div></div><div></div></div>
      <div class="cart-actions">
        <a class="btn btn--redy" href="../SHOP MOCKUP FRAME/index.html">ADD TO CART</a>
        <button class="btn btn--yellowr" type="button" id="checkout-open">PROCEED TO CHECKOUT</button>
      </div>
    </div>
  </main>

  <!-- CHECKOUT / ORDER FORM -->
  <dialog class="checkout" id="checkout" aria-labelledby="checkout-title">
    <form class="checkout__form" id="order-form" method="dialog">
      <button class="checkout__close" type="button" id="checkout-close" aria-label="Close">×</button>
      <h2 class="display" id="checkout-title">ORDER FORM</h2>
      <p class="checkout__note">Fill up your details below. Your order will be sent to <strong>orders@examplewebsite142.com</strong>.</p>

      <fieldset>
        <legend>Your order</legend>
        <div class="grid-2">
          <div class="field field--full">
            <label for="o-product">Tee</label>
            <select id="o-product" required>
              <option value="">Choose a design</option>
              <option>Don’t Be Late</option>
              <option>Everyday Comfort</option>
              <option>Do Good Work</option>
            </select>
          </div>
          <div class="field">
            <label for="o-size">Size</label>
            <select id="o-size" required>
              <option value="">Choose size</option>
              <option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option>
            </select>
          </div>
          <div class="field">
            <label for="o-qty">Quantity</label>
            <input id="o-qty" type="number" min="1" max="20" value="1" required>
          </div>
        </div>
        <p class="checkout__total">Total: <span id="o-total">₱499.00</span> <small>(₱499.00 each, tax included)</small></p>
      </fieldset>

      <fieldset>
        <legend>Contact details</legend>
        <div class="grid-2">
          <div class="field field--full"><label for="o-name">Full name</label><input id="o-name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="o-email">Email</label><input id="o-email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="o-phone">Mobile number</label><input id="o-phone" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX" required></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Delivery address</legend>
        <div class="grid-2">
          <div class="field field--full"><label for="o-street">House no. / Street / Barangay</label><input id="o-street" type="text" autocomplete="street-address" required></div>
          <div class="field"><label for="o-city">City / Municipality</label><input id="o-city" type="text" autocomplete="address-level2" required></div>
          <div class="field"><label for="o-province">Province</label><input id="o-province" type="text" autocomplete="address-level1" required></div>
          <div class="field"><label for="o-zip">ZIP code</label><input id="o-zip" type="text" inputmode="numeric" autocomplete="postal-code" required></div>
          <div class="field">
            <label for="o-pay">Payment method</label>
            <select id="o-pay" required>
              <option value="">Choose one</option>
              <option>Cash on Delivery</option>
              <option>GCash</option>
              <option>Bank Transfer</option>
            </select>
          </div>
          <div class="field field--full"><label for="o-notes">Notes (optional)</label><textarea id="o-notes" rows="3" placeholder="Landmarks, delivery instructions, etc."></textarea></div>
        </div>
      </fieldset>

      <label class="check"><input type="checkbox" id="o-agree" required> I accept and agree to the&nbsp;<a href="../PRIVACY PAGE FRAME/index.html" target="_blank" style="text-decoration:underline">privacy policy</a>.</label>

      <div class="checkout__actions">
        <button class="btn btn--add" type="submit">PLACE ORDER</button>
        <button class="btn btn--ghost-dark" type="button" id="checkout-cancel">Cancel</button>
      </div>
      <p class="checkout__done" id="order-done" hidden></p>
    </form>
  </dialog>

  <script>
    (function () {
      var ORDER_EMAIL = "orders@examplewebsite142.com";
      var PRICE = 499;
      var dlg = document.getElementById("checkout");
      var form = document.getElementById("order-form");
      var qty = document.getElementById("o-qty");
      var total = document.getElementById("o-total");
      var done = document.getElementById("order-done");
      function $(id) { return document.getElementById(id).value.trim(); }
      function peso(n) { return "₱" + n.toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
      function updateTotal() { total.textContent = peso(PRICE * Math.max(1, +qty.value || 1)); }

      document.getElementById("checkout-open").addEventListener("click", function () {
        done.hidden = true;
        dlg.showModal();
      });
      ["checkout-close", "checkout-cancel"].forEach(function (id) {
        document.getElementById(id).addEventListener("click", function () { dlg.close(); });
      });
      dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); }); // click outside closes
      qty.addEventListener("input", updateTotal);

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!form.reportValidity()) return;
        var q = Math.max(1, +qty.value || 1);
        var orderNo = "KK-" + Date.now().toString().slice(-6);
        var body = [
          "NEW ORDER " + orderNo,
          "",
          "ORDER",
          "Tee: " + $("o-product"),
          "Size: " + $("o-size"),
          "Quantity: " + q,
          "Total: " + peso(PRICE * q),
          "",
          "CUSTOMER",
          "Name: " + $("o-name"),
          "Email: " + $("o-email"),
          "Mobile: " + $("o-phone"),
          "",
          "DELIVERY ADDRESS",
          $("o-street"),
          $("o-city") + ", " + $("o-province") + " " + $("o-zip"),
          "",
          "Payment: " + $("o-pay"),
          "Notes: " + ($("o-notes") || "—")
        ].join("\n");
        var subject = "Order " + orderNo + " — " + $("o-product") + " (" + $("o-size") + ") x" + q;
        window.location.href = "mailto:" + ORDER_EMAIL +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
        done.textContent = "Your email app is opening with order " + orderNo + " addressed to " + ORDER_EMAIL + ". Press Send there to place your order.";
        done.hidden = false;
      });
    })();
  </script>

  <footer class="footer footer--dark">
    <a href="../PRIVACY PAGE FRAME/index.html">Privacy &nbsp;•&nbsp; Terms</a>
    <span>kúro-kurò &nbsp;•&nbsp; © 2026</span>
  </footer>
</body>
</html>
