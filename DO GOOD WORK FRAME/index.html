*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  -webkit-font-smoothing: auto;
}

button {
  -webkit-font-smoothing: inherit;
  -moz-osx-font-smoothing: inherit;
  -webkit-appearance: none;
}
* {
  padding: 0;
  margin: 0;
}a {
  color: inherit;
  text-decoration: inherit;
}
input {
  border: none;
  font: inherit;
  outline: none;
  background-color: inherit;
}
button {
  border-style: none;
  width: auto;
  overflow: visible;
  background: transparent;
  font: inherit;
  line-height: normal;
  color: inherit;
}
textarea {
  font: inherit;
  background-color: inherit;
}
select {
  font: inherit;
  background-color: inherit;
}
img {
  display: block;
}
picture {
  display: block;
}
video {
  display: block;
}
canvas {
  display: block;
}
svg {
  display: block;
}

[data-visible='false']{
  display:none!important;
}

.before-hidden::before {
  display:none;
}

.after-hidden::after {
  display:none;
}

.before-visible::before {
  content: "";
}

.after-visible::after {
  content: "";
}

.text {
  white-space: pre-wrap;
  overflow-wrap: break-word;
  /* Figma advances a tab exactly one space, wherever it sits (measured). CSS
     can only set tab stops: one every space-width brings a tab within about
     half a space of Figma, where the default stop every 8 spaces is far off */
  tab-size: 1;
}
</style>
